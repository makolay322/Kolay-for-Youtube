name: Build & lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check translations
        run: node tools/check-i18n.js
      - name: Build store packages
        run: python3 tools/build.py --unpacked
      - name: Lint Firefox package (web-ext)
        run: npx --yes web-ext@8 lint --source-dir dist/unpacked/firefox --warnings-as-errors
      - uses: actions/upload-artifact@v4
        with:
          name: kolay-for-youtube-packages
          path: dist/*.zip

  # Pushing to main with a new version in extension/manifest.json tags it, creates the
  # GitHub release and sends the Chrome and Firefox packages to the stores.
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Is this version new?
        id: v
        run: |
          ver=$(python3 -c "import json;print(json.load(open('extension/manifest.json'))['version'])")
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$ver" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"; echo "v$ver already released, skipping"
          else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - name: Build packages
        if: steps.v.outputs.new == 'true'
        run: python3 tools/build.py
      - name: Publish to Chrome Web Store
        if: steps.v.outputs.new == 'true'
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: python3 tools/publish-chrome.py dist/kolay-for-youtube-${{ steps.v.outputs.ver }}-chrome.zip
      - name: Publish to Firefox Add-ons
        if: steps.v.outputs.new == 'true'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          AMO_ADDON_ID: ${{ vars.AMO_ADDON_ID }}
        run: python3 tools/publish-firefox.py dist/kolay-for-youtube-${{ steps.v.outputs.ver }}-firefox.zip
      - name: Tag and GitHub release
        if: steps.v.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.ver }}
          target_commitish: ${{ github.sha }}
          files: dist/*.zip
          generate_release_notes: true
